<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SupportLens Chat</title>

  <style>
    :root {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      color: #1e293b;
      background: #f5f7fb;
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    body { margin: 0; }

    button, textarea { font: inherit; }

    button { cursor: pointer; }

    button:disabled { cursor: wait; opacity: 0.6; }

    button:focus-visible, textarea:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 3px;
    }

    [hidden] { display: none !important; }

    .app {
      max-width: 960px;
      margin: auto;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-inline: 1px solid #e2e8f0;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 26px;
      border-bottom: 1px solid #e2e8f0;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .logo {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-weight: 800;
    }

    h1 { font-size: 20px; margin: 0; }

    .subtitle {
      font-size: 12px;
      color: #64748b;
      margin: 4px 0 0;
    }

    .new-chat {
      border: 1px solid #cbd5e1;
      background: white;
      padding: 9px 13px;
      border-radius: 9px;
      white-space: nowrap;
      color: #334155;
    }

    .conversation {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 28px;
    }

    .welcome {
      max-width: 600px;
      margin: 50px auto;
      text-align: center;
    }

    .welcome h2 { font-size: 28px; margin-bottom: 12px; }

    .welcome p { color: #64748b; line-height: 1.7; }

    .suggestions {
      display: grid;
      gap: 10px;
      margin-top: 24px;
    }

    .suggestion {
      text-align: left;
      padding: 15px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background: #f8fafc;
      color: #334155;
    }

    .suggestion:hover { background: #eff6ff; border-color: #bfdbfe; }

    .message {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    .message.user { align-items: flex-end; }

    .speaker {
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      margin: 0 8px 7px;
    }

    .bubble {
      max-width: 88%;
      padding: 16px 18px;
      background: #f1f5f9;
      border-radius: 16px 16px 16px 4px;
      overflow-wrap: anywhere;
    }

    .user .bubble {
      background: #2563eb;
      color: white;
      border-radius: 16px 16px 4px 16px;
    }

    .message-text {
      margin: 0;
      white-space: pre-wrap;
      line-height: 1.7;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      background: #e0e7ff;
      color: #3730a3;
      margin-bottom: 10px;
    }

    .badge[data-kind="answered"] {
      color: #166534;
      background: #dcfce7;
    }

    .badge[data-kind="withheld"],
    .badge[data-kind="error"] {
      color: #9a3412;
      background: #ffedd5;
    }

    .verification {
      font-size: 12px;
      color: #64748b;
      line-height: 1.6;
      margin: 12px 0 0;
    }

    details {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #dbe3ed;
      font-size: 13px;
    }

    summary { cursor: pointer; font-weight: 650; }

    .sources { padding-left: 18px; margin-bottom: 0; }

    .sources li { margin: 10px 0; line-height: 1.5; }

    .source-location {
      display: block;
      color: #64748b;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .typing {
      display: flex;
      align-items: center;
      gap: 5px;
      min-height: 24px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #64748b;
      animation: pulse 1.2s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    .typing-label { color: #64748b; font-size: 12px; margin-top: 8px; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.35; }
      40% { opacity: 1; }
    }

    .composer-area {
      padding: 16px 26px;
      border-top: 1px solid #e2e8f0;
      background: white;
    }

    form {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      padding: 10px;
    }

    form:focus-within { border-color: #2563eb; }

    textarea {
      flex: 1;
      min-width: 0;
      min-height: 48px;
      max-height: 150px;
      resize: none;
      border: 0;
      background: transparent;
      padding: 12px 8px;
      line-height: 1.5;
      color: #1e293b;
    }

    textarea:focus-visible { outline: none; }

    .send {
      background: #2563eb;
      color: white;
      border: 0;
      padding: 12px 18px;
      border-radius: 9px;
    }

    .footnote {
      font-size: 11px;
      color: #64748b;
      text-align: center;
      line-height: 1.6;
      margin: 10px 0 0;
    }

    @media (max-width: 600px) {
      header { padding: 16px; }
      .conversation { padding: 18px 14px; }
      .composer-area { padding: 12px; }
      .bubble { max-width: 95%; }
      .welcome { margin-top: 28px; }
      .welcome h2 { font-size: 24px; }
      .subtitle { max-width: 180px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .typing span { animation: none; }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true">S</div>
        <div>
          <h1>SupportLens</h1>
          <p class="subtitle">Support answers with evidence</p>
        </div>
      </div>

      <button id="new-chat" class="new-chat" type="button">
        New chat
      </button>
    </header>

    <section
      id="conversation"
      class="conversation"
      aria-label="Conversation"
    >
      <div id="welcome" class="welcome">
        <h2>How can I help?</h2>
        <p>
          Ask about account access, document uploads, or background jobs
          in the demonstration knowledge base.
        </p>

        <div class="suggestions">
          <button class="suggestion" type="button">
            Will resetting my password resolve AUTH-423?
          </button>
          <button class="suggestion" type="button">
            Can I upload a file larger than 10 MB?
          </button>
          <button class="suggestion" type="button">
            How do I reset my password?
          </button>
        </div>
      </div>

      <div
        id="messages"
        role="log"
        aria-label="Chat messages"
        aria-live="polite"
        aria-relevant="additions text"
      ></div>
    </section>

    <div class="composer-area">
      <form id="chat-form">
        <textarea
          id="question"
          aria-label="Your support question"
          placeholder="Ask a support question…"
          maxlength="2000"
          rows="1"
          required
        ></textarea>

        <button id="send-button" class="send" type="submit">
          Send
        </button>
      </form>

      <p class="footnote">
        Each message is answered independently. History clears on refresh.
        Model checks can make mistakes.
      </p>
    </div>
  </main>

  <script src="/chat.js" defer></script>
  
</body>
</html>
