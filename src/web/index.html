<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SupportLens Chat</title>

  <style>
    :root {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      color: #1e293b;
      background: #f5f7fb;
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    body { margin: 0; }

    button, textarea { font: inherit; }

    button { cursor: pointer; }

    button:disabled { cursor: wait; opacity: 0.6; }

    button:focus-visible, textarea:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 3px;
    }

    [hidden] { display: none !important; }

    .app {
      max-width: 960px;
      margin: auto;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-inline: 1px solid #e2e8f0;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 26px;
      border-bottom: 1px solid #e2e8f0;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .logo {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-weight: 800;
    }

    h1 { font-size: 20px; margin: 0; }

    .subtitle {
      font-size: 12px;
      color: #64748b;
      margin: 4px 0 0;
    }

    .new-chat {
      border: 1px solid #cbd5e1;
      background: white;
      padding: 9px 13px;
      border-radius: 9px;
      white-space: nowrap;
      color: #334155;
    }

    .conversation {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 28px;
    }

    .welcome {
      max-width: 600px;
      margin: 50px auto;
      text-align: center;
    }

    .welcome h2 { font-size: 28px; margin-bottom: 12px; }

    .welcome p { color: #64748b; line-height: 1.7; }

    .suggestions {
      display: grid;
      gap: 10px;
      margin-top: 24px;
    }

    .suggestion {
      text-align: left;
      padding: 15px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background: #f8fafc;
      color: #334155;
    }

    .suggestion:hover { background: #eff6ff; border-color: #bfdbfe; }

    .message {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    .message.user { align-items: flex-end; }

    .speaker {
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      margin: 0 8px 7px;
    }

    .bubble {
      max-width: 88%;
      padding: 16px 18px;
      background: #f1f5f9;
      border-radius: 16px 16px 16px 4px;
      overflow-wrap: anywhere;
    }

    .user .bubble {
      background: #2563eb;
      color: white;
      border-radius: 16px 16px 4px 16px;
    }

    .message-text {
      margin: 0;
      white-space: pre-wrap;
      line-height: 1.7;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      background: #e0e7ff;
      color: #3730a3;
      margin-bottom: 10px;
    }

    .badge[data-kind="answered"] {
      color: #166534;
      background: #dcfce7;
    }

    .badge[data-kind="withheld"],
    .badge[data-kind="error"] {
      color: #9a3412;
      background: #ffedd5;
    }

    .verification {
      font-size: 12px;
      color: #64748b;
      line-height: 1.6;
      margin: 12px 0 0;
    }

    details {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #dbe3ed;
      font-size: 13px;
    }

    summary { cursor: pointer; font-weight: 650; }

    .sources { padding-left: 18px; margin-bottom: 0; }

    .sources li { margin: 10px 0; line-height: 1.5; }

    .source-location {
      display: block;
      color: #64748b;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .typing {
      display: flex;
      align-items: center;
      gap: 5px;
      min-height: 24px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #64748b;
      animation: pulse 1.2s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    .typing-label { color: #64748b; font-size: 12px; margin-top: 8px; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.35; }
      40% { opacity: 1; }
    }

    .composer-area {
      padding: 16px 26px;
      border-top: 1px solid #e2e8f0;
      background: white;
    }

    form {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      padding: 10px;
    }

    form:focus-within { border-color: #2563eb; }

    textarea {
      flex: 1;
      min-width: 0;
      min-height: 48px;
      max-height: 150px;
      resize: none;
      border: 0;
      background: transparent;
      padding: 12px 8px;
      line-height: 1.5;
      color: #1e293b;
    }

    textarea:focus-visible { outline: none; }

    .send {
      background: #2563eb;
      color: white;
      border: 0;
      padding: 12px 18px;
      border-radius: 9px;
    }

    .footnote {
      font-size: 11px;
      color: #64748b;
      text-align: center;
      line-height: 1.6;
      margin: 10px 0 0;
    }

    @media (max-width: 600px) {
      header { padding: 16px; }
      .conversation { padding: 18px 14px; }
      .composer-area { padding: 12px; }
      .bubble { max-width: 95%; }
      .welcome { margin-top: 28px; }
      .welcome h2 { font-size: 24px; }
      .subtitle { max-width: 180px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .typing span { animation: none; }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true">S</div>
        <div>
          <h1>SupportLens</h1>
          <p class="subtitle">Support answers with evidence</p>
        </div>
      </div>

      <button id="new-chat" class="new-chat" type="button">
        New chat
      </button>
    </header>

    <section
      id="conversation"
      class="conversation"
      aria-label="Conversation"
    >
      <div id="welcome" class="welcome">
        <h2>How can I help?</h2>
        <p>
          Ask about account access, document uploads, or background jobs
          in the demonstration knowledge base.
        </p>

        <div class="suggestions">
          <button class="suggestion" type="button">
            Will resetting my password resolve AUTH-423?
          </button>
          <button class="suggestion" type="button">
            Can I upload a file larger than 10 MB?
          </button>
          <button class="suggestion" type="button">
            How do I reset my password?
          </button>
        </div>
      </div>

      <div
        id="messages"
        role="log"
        aria-label="Chat messages"
        aria-live="polite"
        aria-relevant="additions text"
      ></div>
    </section>

    <div class="composer-area">
      <form id="chat-form">
        <textarea
          id="question"
          aria-label="Your support question"
          placeholder="Ask a support question…"
          maxlength="2000"
          rows="1"
          required
        ></textarea>

        <button id="send-button" class="send" type="submit">
          Send
        </button>
      </form>

      <p class="footnote">
        Each message is answered independently. History clears on refresh.
        Model checks can make mistakes.
      </p>
    </div>
  </main>

  <script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("question");
    const sendButton = document.getElementById("send-button");
    const newChatButton = document.getElementById("new-chat");
    const conversation = document.getElementById("conversation");
    const messages = document.getElementById("messages");
    const welcome = document.getElementById("welcome");

    let busy = false;

    const labels = {
      answered: "Answered",
      clarification_needed: "More detail needed",
      insufficient_evidence: "Insufficient evidence"
    };

    function scrollToLatest() {
      conversation.scrollTop = conversation.scrollHeight;
    }

    function resizeInput() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 150) + "px";
    }

    function setBusy(value) {
      busy = value;
      sendButton.disabled = value;
      input.disabled = value;
      newChatButton.disabled = value;
      sendButton.textContent = value ? "Waiting…" : "Send";
    }

    function createMessage(role) {
      const article = document.createElement("article");
      article.className = `message ${role}`;

      const speaker = document.createElement("div");
      speaker.className = "speaker";
      speaker.textContent = role === "user" ? "You" : "SupportLens";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      article.append(speaker, bubble);
      messages.appendChild(article);

      return { article, bubble };
    }

    function appendText(parent, text, className) {
      const paragraph = document.createElement("p");
      paragraph.className = className;
      paragraph.textContent = text;
      parent.appendChild(paragraph);
    }

    function addUserMessage(question) {
      const message = createMessage("user");
      appendText(message.bubble, question, "message-text");
    }

    function addTypingIndicator() {
      const message = createMessage("assistant");
      const dots = document.createElement("div");
      dots.className = "typing";
      dots.setAttribute("aria-hidden", "true");

      for (let i = 0; i < 3; i++) {
        dots.appendChild(document.createElement("span"));
      }

      message.bubble.appendChild(dots);
      appendText(
        message.bubble,
        "Retrieving evidence and checking the response…",
        "typing-label"
      );

      return message;
    }

    function renderMessage(message, kind, label, text, note = "") {
      message.bubble.replaceChildren();

      const badge = document.createElement("span");
      badge.className = "badge";
      badge.dataset.kind = kind;
      badge.textContent = label;

      message.bubble.appendChild(badge);
      appendText(message.bubble, text, "message-text");

      if (note) {
        appendText(message.bubble, note, "verification");
      }
    }

    function addSources(bubble, sources) {
      if (!Array.isArray(sources) || sources.length === 0) return;

      const details = document.createElement("details");
      const summary = document.createElement("summary");
      summary.textContent = `Sources (${sources.length})`;

      const list = document.createElement("ul");
      list.className = "sources";

      for (const source of sources) {
        const item = document.createElement("li");
        const title = document.createElement("strong");
        const location = document.createElement("span");

        title.textContent = `[${source.id}] ${source.title}`;
        location.className = "source-location";
        location.textContent = source.source;

        item.append(title, location);
        list.appendChild(item);
      }

      details.append(summary, list);
      bubble.appendChild(details);
    }

    function errorMessage(data, status) {
      if (typeof data?.detail === "string") return data.detail;

      if (Array.isArray(data?.detail)) {
        return data.detail
          .map(item => item.msg || "Invalid request.")
          .join(" ");
      }

      return `The request failed (HTTP ${status}).`;
    }

    function renderResponse(message, data) {
      // Withheld drafts must never appear in the conversation.
      if (data?.withheld === true) {
        renderMessage(
          message,
          "withheld",
          "Answer withheld",
          "I could not confirm that the draft was supported by the evidence.",
          "The draft has not been displayed."
        );
        return;
      }

      if (
        data?.withheld !== false ||
        !data.answer ||
        typeof data.answer.answer !== "string" ||
        !Object.hasOwn(labels, data.answer.status)
      ) {
        throw new Error("The server returned an unexpected response format.");
      }

      const answer = data.answer;

      if (
        answer.status === "answered" &&
        data.verification_status !== "supported"
      ) {
        renderMessage(
          message,
          "withheld",
          "Answer withheld",
          "This response did not include a successful claim-support check."
        );
        return;
      }

      const note = answer.status === "answered"
        ? "Model-based support check passed. This check can still make mistakes."
        : "Claim-support verification was skipped for this non-answer response.";

      renderMessage(
        message,
        answer.status,
        labels[answer.status],
        answer.answer,
        note
      );

      addSources(message.bubble, data.sources);
    }

    async function sendQuestion(question) {
      if (busy) return;

      welcome.hidden = true;
      setBusy(true);

      addUserMessage(question);
      input.value = "";
      resizeInput();

      const reply = addTypingIndicator();
      scrollToLatest();

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 150000);

      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
          signal: controller.signal
        });

        let data;

        try {
          data = await response.json();
        } catch (error) {
          if (error.name === "AbortError") throw error;
          throw new Error(
            `The server returned an unreadable response (HTTP ${response.status}).`
          );
        }

        if (!response.ok) {
          throw new Error(errorMessage(data, response.status));
        }

        renderResponse(reply, data);
      } catch (error) {
        const message = error.name === "AbortError"
          ? "The browser stopped waiting after 150 seconds. The server may still be processing your question."
          : error instanceof TypeError
            ? "Could not reach SupportLens. Check that your local server is running."
            : error.message || "An unexpected error occurred.";

        renderMessage(reply, "error", "Request unsuccessful", message);
      } finally {
        clearTimeout(timeout);
        setBusy(false);
        scrollToLatest();
        input.focus();
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();

      const question = input.value.trim();

      if (!question) {
        input.setCustomValidity("Please enter a question.");
        input.reportValidity();
        return;
      }

      input.setCustomValidity("");
      sendQuestion(question);
    });

    input.addEventListener("input", () => {
      input.setCustomValidity("");
      resizeInput();
    });

    input.addEventListener("keydown", event => {
      if (
        event.key === "Enter" &&
        !event.shiftKey &&
        !event.isComposing
      ) {
        event.preventDefault();

        if (!busy) {
          form.requestSubmit();
        }
      }
    });

    document.querySelectorAll(".suggestion").forEach(button => {
      button.addEventListener("click", () => {
        if (busy) return;
        input.value = button.textContent.trim();
        input.setCustomValidity("");
        form.requestSubmit();
      });
    });

    newChatButton.addEventListener("click", () => {
      if (busy) return;

      messages.replaceChildren();
      welcome.hidden = false;
      input.value = "";
      input.setCustomValidity("");
      resizeInput();
      input.focus();
    });
  </script>
</body>
</html>
